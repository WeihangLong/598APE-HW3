name: School VM benchmark

on:
  push:
    branches: [main]
    paths:
      - sandpile.c
      - stb_image_write.h
      - scripts/benchmark.py
      - scripts/report-performance.js
      - .github/workflows/school-benchmark.yml
  pull_request:
    branches: [main]
    paths:
      - sandpile.c
      - stb_image_write.h
      - scripts/benchmark.py
      - scripts/report-performance.js
      - .github/workflows/school-benchmark.yml
  workflow_dispatch:
    inputs:
      candidate:
        description: Branch to compare with main
        type: choice
        options:
          - optimize/mirror-scan-bulk
          - optimize/scan-bulk
          - experiment/queue-bulk
        default: optimize/mirror-scan-bulk
      size:
        description: Grid size (1..1001)
        type: number
        default: 1001
      rounds:
        description: Timed runs per version (1..10)
        type: number
        default: 3

permissions:
  contents: read
  pull-requests: write

# Do not overlap performance tests from this repository on the school VM.
concurrency:
  group: hw3-school-benchmark
  # A new main deployment supersedes checks against an obsolete baseline,
  # and CI setup updates supersede stale setup checks. Individual PR/manual
  # benchmark requests remain serialized without cancelling one another.
  cancel-in-progress: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.head_ref == 'ci/school-runner') }}

jobs:
  benchmark:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        candidate: ${{ fromJSON(github.event_name == 'push' && '["optimize/mirror-scan-bulk","optimize/scan-bulk","experiment/queue-bulk"]' || '[""]') }}
    runs-on: [self-hosted, Linux, 598ape-hw3]
    timeout-minutes: 180
    env:
      BENCHMARK_INDEX: ${{ strategy.job-index }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check required tools
        run: |
          gcc --version
          python3 --version
          git --version

      - name: Compare baseline and candidate
        env:
          BASELINE_REF: origin/main
          CANDIDATE_REF: ${{ github.event.pull_request.head.sha || format('origin/{0}', inputs.candidate || matrix.candidate) }}
          # The CI-only PR is a short infrastructure smoke test. Optimization
          # PRs and manual runs benchmark the actual homework size by default.
          GRID_SIZE: ${{ inputs.size || vars.HW3_GRID_SIZE || (github.head_ref == 'ci/school-runner' && '251') || '1001' }}
          ROUNDS: ${{ inputs.rounds || vars.HW3_ROUNDS || '3' }}
        run: |
          python3 scripts/benchmark.py \
            --baseline "$BASELINE_REF" \
            --candidate "$CANDIDATE_REF" \
            --size "$GRID_SIZE" \
            --rounds "$ROUNDS" \
            --output "$RUNNER_TEMP/hw3-results-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$BENCHMARK_INDEX"

      - name: Publish job summary
        if: success()
        run: cat "$RUNNER_TEMP/hw3-results-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$BENCHMARK_INDEX/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Report speedup on the pull request
        if: success()
        uses: actions/github-script@v7
        env:
          RESULTS_DIR: ${{ runner.temp }}/hw3-results-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
          CANDIDATE_BRANCH: ${{ inputs.candidate || matrix.candidate }}
        with:
          script: |
            const report = require('./scripts/report-performance.js');
            await report({github, context, core});

      - name: Upload measurements and output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hw3-benchmark-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/hw3-results-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/
          if-no-files-found: ignore
