name: School VM benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - sandpile.c
      - stb_image_write.h
      - scripts/benchmark.py
      - scripts/report-performance.js
      - .github/workflows/school-benchmark.yml
  workflow_dispatch:
    inputs:
      candidate:
        description: Version to benchmark
        type: choice
        options:
          - main
          - experiment/queue-bulk
          - experiment/static-grid
        default: main
      baseline:
        description: Optional baseline commit or ref (blank uses the variant's starting point)
        type: string
        required: false
      size:
        description: Grid size (1..1001)
        type: number
        default: 1001
      rounds:
        description: Timed runs per version (1..10)
        type: number
        default: 1

permissions:
  contents: read
  pull-requests: write

# Do not overlap performance tests from this repository on the school VM.
concurrency:
  group: hw3-school-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, 598ape-hw3]
    timeout-minutes: 180
    env:
      BENCHMARK_INDEX: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check required tools
        run: |
          gcc --version
          python3 --version
          git --version

      - name: Compare baseline and candidate
        env:
          BASELINE_REF: ${{ inputs.baseline }}
          CANDIDATE_BRANCH: ${{ github.head_ref || inputs.candidate }}
          CANDIDATE_REF: ${{ github.event.pull_request.head.sha || format('origin/{0}', inputs.candidate) }}
          # The CI-only PR is a short infrastructure smoke test. Optimization
          # PRs and manual runs benchmark the actual homework size by default.
          GRID_SIZE: ${{ inputs.size || vars.HW3_GRID_SIZE || (github.head_ref == 'ci/school-runner' && '251') || '1001' }}
          ROUNDS: ${{ inputs.rounds || '1' }}
          BENCHMARK_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$BASELINE_REF" ]; then
            case "$CANDIDATE_BRANCH" in
              main)
                BASELINE_REF=d6ffed56b4a8fe45bd5c74d69028f46dba9d5a6c ;;
              experiment/static-grid)
                BASELINE_REF=73a10677459c3d641bed59aee4cf6972b404fc7b ;;
              *) BASELINE_REF=15fe837445b8e32a15ac61fcfa388980b54d9173 ;;
            esac
          fi
          python3 scripts/benchmark.py \
            --baseline "$BASELINE_REF" \
            --candidate "$CANDIDATE_REF" \
            --size "$GRID_SIZE" \
            --rounds "$ROUNDS" \
            --baseline-cache-dir "$RUNNER_TOOL_CACHE/hw3-baselines" \
            --output "$RUNNER_TEMP/hw3-results-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$BENCHMARK_INDEX"

      - name: Publish job summary
        if: success()
        run: cat "$RUNNER_TEMP/hw3-results-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$BENCHMARK_INDEX/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Report speedup on the pull request
        if: success()
        uses: actions/github-script@v7
        env:
          RESULTS_DIR: ${{ runner.temp }}/hw3-results-${{ github.run_id }}-${{ github.run_attempt }}-0
          CANDIDATE_BRANCH: ${{ github.head_ref || inputs.candidate }}
        with:
          script: |
            const report = require('./scripts/report-performance.js');
            await report({github, context, core});

      - name: Upload measurements and output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hw3-benchmark-${{ github.run_id }}-${{ github.run_attempt }}-0
          path: ${{ runner.temp }}/hw3-results-${{ github.run_id }}-${{ github.run_attempt }}-0/
          if-no-files-found: ignore
